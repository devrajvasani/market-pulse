version: 2

models:
  - name: silver_prices
    description: >
      Typed, deduplicated hourly price snapshots — one row per coin per snapshot
      hour, with real timestamps. The data-quality gate for the Silver layer:
      these tests must pass before anything downstream (Gold) is built.
    # Natural key is unique across the whole table (one capture per coin per hour).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - coin_id
              - snapshot_date
              - snapshot_hour
    columns:
      - name: coin_id
        description: "CoinGecko coin id — part of the natural key."
        data_tests:
          - not_null
      - name: snapshot_date
        description: "Capture date (partition) — part of the natural key."
        data_tests:
          - not_null
      - name: snapshot_hour
        description: "Capture hour 0-23 (partition) — part of the natural key."
        data_tests:
          - not_null
      - name: ingested_at
        description: "When ingestion captured the row (UTC)."
        data_tests:
          - not_null
      - name: current_price
        description: "Spot price in the quote currency — must be present and positive."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

  - name: silver_trades
    description: >
      Typed, deduplicated streaming trades — one row per trade_id, with real
      timestamps. Fed by the Kinesis consumer (bronze/trades NDJSON). The DQ gate
      for the streaming Silver layer.
    columns:
      - name: trade_id
        description: "Exchange trade id — the natural key (unique per trade)."
        data_tests:
          - not_null
          - unique
      - name: product_id
        description: "Trading pair, e.g. BTC-USD."
        data_tests:
          - not_null
      - name: event_time
        description: "When the trade happened on the exchange (UTC)."
        data_tests:
          - not_null
      - name: price
        description: "Trade price — present and positive."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
