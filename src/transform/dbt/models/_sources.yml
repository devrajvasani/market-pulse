version: 2

# Bronze is the raw layer landed by Stage 1 batch ingestion. dbt reads it two ways
# by adapter, with NO change to the model SQL:
#   - Athena : the existing Glue table  marketpulse_dev.bronze_prices  (Stage 2).
#   - DuckDB : read_parquet over the same Parquet, via the external_location below.
# The DuckDB glob comes from DBT_BRONZE_GLOB (built from BRONZE_BUCKET) so the path
# is never hardcoded and works against LocalStack or real S3 by config. dbt-athena
# ignores external_location and uses schema.identifier instead.
sources:
  - name: bronze
    description: "Raw hourly price snapshots (one row per coin per snapshot hour), as ingested."
    schema: "{{ env_var('GLUE_DATABASE', 'marketpulse_dev') }}"
    tables:
      - name: prices
        identifier: bronze_prices
        description: "Bronze prices: raw values + ISO-string timestamps, partitioned by date/hour."
        meta:
          external_location: >-
            read_parquet('{{ env_var('DBT_BRONZE_GLOB', '') }}',
              hive_partitioning = true, hive_types_autocast = 0)
      - name: trades
        identifier: bronze_trades
        description: "Bronze trades: raw streaming trade records as NDJSON, partitioned by date/hour (Stage 4)."
        meta:
          # Streaming Bronze is NDJSON (boto3 consumer, no Parquet libs). DuckDB reads it with
          # read_json; Athena uses a JSON-SerDe Glue table `bronze_trades` (added in 4d).
          external_location: >-
            read_json_auto('{{ env_var('DBT_TRADES_GLOB', '') }}',
              format = 'newline_delimited', hive_partitioning = true)
