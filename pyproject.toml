# MarketPulse — Python project configuration (managed with `uv`).
# Runtime deps stay minimal at Stage 0; later stages add their own (e.g. tenacity in Stage 1).
[project]
name = "marketpulse"
version = "0.1.0"
description = "Real-time market-intelligence lakehouse on AWS, runnable free locally by config swap."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",        # AWS SDK — respects AWS_ENDPOINT_URL for LocalStack (Group A services)
    "duckdb>=1.4",        # local query engine (Athena twin); >=1.4 = native MERGE INTO, which
    #                       dbt-duckdb's `merge` incremental strategy needs for Silver (Section B)
    "python-dotenv>=1.0", # auto-load .env + config/environments/*.env (config/settings.py)
    "awswrangler>=3.9",   # partitioned Parquet -> S3 (idempotent overwrite_partitions); pandas+pyarrow
    #                       on Lambda this comes from the AWS SDK for pandas layer, not the zip
    "dbt-core>=1.10,<2",  # SQL ELT framework — Bronze->Silver->Gold models + data tests (Stage 3)
    "dbt-duckdb>=1.10,<2", # dbt adapter for the local DuckDB twin (free)
    "dbt-athena>=1.9,<2", # dbt adapter for the AWS path: writes Iceberg via Athena (Stage 3c)
    "websocket-client>=1.7", # streaming producer: Coinbase trades WebSocket -> Kinesis (Stage 4)
]

# Dev/test tooling. Installed via `uv sync` into the project venv; used by `make test` and CI.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto[s3,secretsmanager]>=5.0",  # in-memory AWS mocks so tests run free + offline (Section L.6)
    "ruff>=0.6",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",           # secret scanner for the pre-commit hook (Section O.5)
    "terraform-local>=0.18",         # tflocal: apply Terraform to LocalStack for free (iac-terraform)
]

# This is an application, not a distributable library — uv should manage the env, not build a wheel.
[tool.uv]
package = false

# ── Ruff: linter + formatter (PEP 8, imports, docstrings) ─────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, D pydocstyle (docstrings required).
select = ["E", "W", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]  # resolve the two well-known mutually-exclusive docstring rules

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests and package markers don't need the full docstring set.
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]
"**/__init__.py" = ["D104"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # import `config.*` and `src.*` from the repo root
addopts = "-q"
