# LocalStack — project-owned AWS emulator for free local development (file 04).
#   start:  docker compose up -d        stop:  docker compose down
#   health: curl http://localhost:4566/_localstack/health   (file 04 section 4.4)
# Glue & Athena are LocalStack Pro-only -> MarketPulse uses DuckDB + PySpark
# locally instead (the backend-adapter pattern, plan Section B / file 04 section 4.3).

# Explicit Compose project name -> Docker groups these as "marketpulse-localstack" instead of the
# folder-derived default "localstack" (which could collide with other LocalStack projects).
name: marketpulse-localstack

services:
  localstack:
    container_name: marketpulse-localstack
    # Pinned to the 3.x Community line, which runs TOKEN-FREE. Newer images (4.x / 2026.x)
    # gate even Community behind a free LOCALSTACK_AUTH_TOKEN — the passthrough below supports
    # that if you ever upgrade. See infrastructure/localstack/README.md.
    image: localstack/localstack:3
    ports:
      - "4566:4566"        # single gateway endpoint for every emulated service
    environment:
      # Only the Community (free) services MarketPulse actually uses (file 04 section 4.3).
      SERVICES: "s3,kinesis,lambda,sqs,sns,events,stepfunctions,secretsmanager,kms,logs,iam,sts"
      DEBUG: "0"           # set to 1 temporarily for verbose logs when troubleshooting
      AWS_DEFAULT_REGION: "us-east-1"
      # OPTIONAL on the pinned 3.x image (runs token-free). Required only if you bump the image
      # to a newer 4.x/2026.x release, which gates even Community behind a free token
      # (plan 01 sections 5/10). It is a SECRET — put it in infrastructure/localstack/.env
      # (gitignored; Compose auto-reads it) as LOCALSTACK_AUTH_TOKEN=<token>, never committed.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - "./volume:/var/lib/localstack"                 # runtime state — gitignored (file 04 section 4.5)
      - "/var/run/docker.sock:/var/run/docker.sock"    # lets LocalStack launch Lambda containers
    healthcheck:
      # "Container up" != "services ready" — gate dependents on real readiness (file 04 section 4.4).
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # MarketPulse console — a small READ-ONLY boto3 dashboard (service health, S3 + objects, Lambda,
  # secrets/KMS/EventBridge, ...). Built from ./ui; started only once LocalStack is HEALTHY.
  ui:
    container_name: marketpulse-localstack-ui
    build: ./ui
    ports:
      - "8080:8080"
    environment:
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test" # pragma: allowlist secret -- dummy; LocalStack ignores creds
      AWS_DEFAULT_REGION: "us-east-1"
      LOCALSTACK_ENDPOINT: "http://localstack:4566" # the localstack service on the compose network
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped
